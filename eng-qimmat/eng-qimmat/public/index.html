<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eng Qimmat</title>
<style>
  :root {
    --gold: #f5c542;
    --bg: #0f0f12;
    --card: #1a1a1f;
    --text: #f0f0f0;
    --muted: #8a8a92;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 48px 20px 24px;
  }
  header h1 {
    font-size: 2.4rem;
    margin: 0;
    background: linear-gradient(135deg, var(--gold), #fff3c4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p {
    color: var(--muted);
    margin-top: 8px;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px 60px;
  }
  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    flex: 1;
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
  }
  .stat .num { font-size: 1.5rem; font-weight: 700; color: var(--gold); }
  .stat .label { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .board {
    background: var(--card);
    border-radius: 18px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid #2a2a30;
    gap: 14px;
  }
  .row:last-child { border-bottom: none; }
  .rank {
    width: 32px;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
  }
  .row:nth-child(1) .rank { color: var(--gold); font-size: 1.2rem; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .username { color: var(--muted); font-size: 0.85rem; }
  .amount { font-weight: 700; color: var(--gold); white-space: nowrap; }
  .edition {
    font-size: 0.7rem;
    background: #2a2a30;
    padding: 2px 8px;
    border-radius: 20px;
    color: var(--muted);
    margin-left: 6px;
  }
  .empty { text-align: center; padding: 40px; color: var(--muted); }
  .cta {
    display: block;
    text-align: center;
    margin-top: 28px;
    padding: 16px;
    background: var(--gold);
    color: #1a1a1f;
    border-radius: 14px;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
  <header>
    <h1>👑 Eng Qimmat</h1>
    <p>Reytingda birinchi bo'lish uchun pul to'lang</p>
  </header>
  <div class="container">
    <div class="stats">
      <div class="stat"><div class="num" id="totalAmount">–</div><div class="label">Jami to'langan</div></div>
      <div class="stat"><div class="num" id="totalPeople">–</div><div class="label">Ishtirokchilar</div></div>
      <div class="stat"><div class="num" id="editionsLeft">–</div><div class="label">Edition qoldi</div></div>
    </div>
    <div class="board" id="board">
      <div class="empty">Yuklanmoqda...</div>
    </div>
    <a class="cta" id="ctaBtn" href="#" target="_blank">To'lash va reytingga chiqish 👑</a>
  </div>

<script>
const API = '';
async function load() {
  const [board, settings] = await Promise.all([
    fetch(API + '/api/leaderboard').then(r => r.json()),
    fetch(API + '/api/settings').then(r => r.json())
  ]);

  const total = board.reduce((s, e) => s + e.amount, 0);
  document.getElementById('totalAmount').textContent = total.toLocaleString('uz-UZ') + " so'm";
  document.getElementById('totalPeople').textContent = board.length;
  document.getElementById('editionsLeft').textContent =
    (settings.editions_total - settings.editions_sold) + ' / ' + settings.editions_total;

  const boardEl = document.getElementById('board');
  if (board.length === 0) {
    boardEl.innerHTML = '<div class="empty">Hali hech kim to\'lamagan. Birinchi bo\'ling!</div>';
    return;
  }
  boardEl.innerHTML = board.map((e, i) => `
    <div class="row">
      <div class="rank">${i + 1}</div>
      <div class="info">
        <div class="name">${escapeHtml(e.name)} ${e.edition_number ? `<span class="edition">#${e.edition_number}</span>` : ''}</div>
        ${e.username ? `<div class="username">${escapeHtml(e.username)}</div>` : ''}
      </div>
      <div class="amount">${e.amount.toLocaleString('uz-UZ')} so'm</div>
    </div>
  `).join('');
}
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
// TODO: bu yerga o'z telegram bot username'ingizni qo'ying
document.getElementById('ctaBtn').href = 'https://t.me/YOUR_BOT_USERNAME';
load();
setInterval(load, 5000);
</script>
</body>
</html>
